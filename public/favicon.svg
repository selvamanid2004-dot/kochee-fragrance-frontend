<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Radial luxury gold sheen gradient -->
    <radialGradient id="goldSheen" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFF3D4"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#694C05"/>
    </radialGradient>
    <!-- Obsidian background subtle vignette -->
    <radialGradient id="obsidianBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="85%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Base Disc -->
  <circle cx="256" cy="256" r="248" fill="url(#obsidianBg)" stroke="url(#goldSheen)" stroke-width="8"/>
  
  <!-- Inner Delicate Luxury Accent Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldSheen)" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#goldSheen)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Top Regal Crown / Star Pips -->
  <polygon points="256,76 261,90 275,90 263,99 268,113 256,104 244,113 249,99 237,90 251,90" fill="url(#goldSheen)"/>

  <!-- Iconic Haute Parfumerie Serif 'K' Monogram -->
  <g fill="url(#goldSheen)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
    <!-- Vertical Spine with Classic Serif Base and Head -->
    <path d="M 160 148 L 204 148 L 204 364 L 160 364 L 160 376 L 228 376 L 228 364 L 204 364 L 204 148 L 228 148 L 228 136 L 160 136 Z"/>
    
    <!-- Upper Diagonal Arm -->
    <path d="M 204 260 L 306 148 L 278 148 L 278 136 L 350 136 L 350 148 L 324 148 L 230 248 Z"/>
    
    <!-- Lower Diagonal Leg with Graceful Luxury Swash -->
    <path d="M 220 236 L 326 364 L 356 364 L 356 376 L 284 376 L 284 364 L 304 364 L 210 250 Z"/>
  </g>

  <!-- Bottom Brand Signature Tagline -->
  <text x="256" y="420" font-family="'Cinzel', 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="12" fill="url(#goldSheen)" text-anchor="middle">
    KOCHEE
  </text>
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="6" fill="#888888" text-anchor="middle">
    HAUTE PARFUMERIE
  </text>
</svg>
