<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="60%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="goldGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF5DC"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#9A7010"/>
      <stop offset="100%" stop-color="#5A4005"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Noir Background -->
  <rect width="1200" height="630" fill="url(#cardBg)"/>

  <!-- Ornate Luxury Border Frame -->
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.45"/>
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="12 8"/>

  <!-- Corner Flourishes -->
  <path d="M 36 76 L 76 36 M 1164 76 L 1124 36 M 36 554 L 76 594 M 1164 554 L 1124 594" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Center Emblem Monogram Disc -->
  <circle cx="600" cy="180" r="64" fill="#141414" stroke="url(#goldGradient)" stroke-width="3"/>
  <circle cx="600" cy="180" r="56" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <text x="600" y="202" font-family="'Cinzel', 'Times New Roman', serif" font-size="52" font-weight="800" fill="url(#goldGradient)" text-anchor="middle">K</text>

  <!-- Title & Branding -->
  <text x="600" y="300" font-family="'Cinzel', 'Times New Roman', serif" font-size="54" font-weight="800" letter-spacing="16" fill="#FFFFFF" text-anchor="middle">
    KOCHEE FRAGRANCE
  </text>
  
  <text x="600" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" letter-spacing="10" fill="url(#goldGradient)" text-anchor="middle">
    HAUTE PARFUMERIE • PARIS &amp; GRASSE
  </text>

  <!-- Separator Line -->
  <line x1="300" y1="375" x2="900" y2="375" stroke="url(#goldLine)" stroke-width="2"/>

  <!-- Value Propositions / Highlights -->
  <text x="600" y="435" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="500" fill="#E5E5E5" text-anchor="middle">
    Authentic French Perfume Extraits • Pure 25% Oil Concentrations • Artisanal Arabian Ouds
  </text>
  
  <text x="600" y="480" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="400" fill="#A3A3A3" text-anchor="middle">
    Free 2ml Wear Tester With Every Flacon • Complimentary Pan-India Express Delivery • COD Available
  </text>

  <!-- Badges Pill Bottom -->
  <g transform="translate(600, 535)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1A1A1A" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">
      SHOP ONLINE AT KOCHEEFRAGRANCE.COM
